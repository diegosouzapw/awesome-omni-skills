name: social-selling
description: Policy-safe social selling workflow for LinkedIn profile optimization, Sales Navigator workflows, content-to-conversation design, DM sequencing, employee advocacy, and CRM attribution.
entrypoint: SKILL.md
when_to_use:
  - When the user needs LinkedIn or social-selling strategy rather than technical implementation.
  - When the request involves profile optimization, social prospecting, Sales Navigator process design, DM sequence drafting, or social pipeline attribution.
  - When policy-safe boundaries around outreach and automation must be explicit.
not_for:
  - Scraping, prohibited automation, fake engagement, or identity evasion.
  - Software implementation, code review, or architecture work.
  - Broad brand strategy when social selling is not the main workflow.
inputs:
  - icp
  - offer
  - current_linkedin_motion
  - target_outcome
  - available_tools
  - crm_context
outputs:
  - prioritized_social_selling_plan
  - profile_rewrite_inputs
  - content_to_conversation_plan
  - personalized_dm_sequence
  - measurement_and_attribution_rules
safety_notes:
  - Prefer native platform workflows and compliant integrations.
  - Treat SSI as directional, not primary.
  - Personalize outreach and stop after repeated non-response.
