name: Validate Skills

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify project identity contract
        run: npm run identity:check

      - name: Validate contribution scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/scripts/validate_contribution_scope.py \
            --repository "${GITHUB_REPOSITORY}" \
            --event-path "${GITHUB_EVENT_PATH}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}"

      - name: Build generated artifacts
        run: npm run build

      - name: Install python test dependencies
        run: pip install pexpect

      - name: Run python unit tests
        run: python3 -m unittest discover -s tools/scripts/tests -p "test_*.py" -v

      - name: Run tests
        run: npm test

      - name: Resolve generated artifact diff scope
        id: generated_scope
        shell: bash
        env:
          # Interpolate event fields through the environment, never inline into the
          # script body. Titles/bodies are attacker-controlled and multi-line, and
          # inlining them into `[[ ... ]]` breaks the shell (and is a script-injection
          # vector). See https://docs.github.com/actions/security-guides/security-hardening-for-github-actions
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          broad_scope() {
            printf '%s\n' \
              README.md \
              CONTRIBUTING.md \
              REPOSITORY-SOURCES.md \
              data/project_status.json \
              metadata.json \
              skills \
              dist/catalog.json \
              dist/bundles.json \
              dist/catalog.db \
              docs \
              ':(exclude)skills/*/metadata.json' \
              ':(exclude)skills_omni/*/metadata.json'
          }

          omni_scope() {
            printf '%s\n' \
              metadata.json \
              dist/catalog.json \
              dist/bundles.json \
              dist/catalog.db \
              skills_omni \
              ':(exclude)skills_omni/*/metadata.json'
          }

          # The narrow (skills_omni-only) scope applies solely to the automated
          # curated-companion PRs opened from a same-repo skills-omni/pr-* branch;
          # every other event uses the broad scope.
          is_automated_omni_pr=false
          if [[ "$EVENT_NAME" == "pull_request" \
                && "$HEAD_REPO" == "$BASE_REPO" \
                && "$HEAD_REF" == skills-omni/pr-* ]] \
            && { [[ "$PR_TITLE" == "enhance: promote curated skills_omni candidates for #"* ]] \
              || [[ "$PR_TITLE" == "feat(skills_omni): curate #"* ]]; } \
            && { [[ "$PR_BODY" == *"This PR was generated automatically from source PR #"* ]] \
              || [[ "$PR_BODY" == *"## Private Curated Companion PR"* ]]; }; then
            is_automated_omni_pr=true
          fi

          {
            echo 'paths<<__PATHS__'
            if [[ "$is_automated_omni_pr" == "true" ]]; then
              omni_scope
            else
              broad_scope
            fi
            echo '__PATHS__'
          } >> "$GITHUB_OUTPUT"

      - name: Check generated artifacts are committed
        shell: bash
        run: |
          mapfile -t GENERATED_PATHS < <(printf '%s\n' "${{ steps.generated_scope.outputs.paths }}")
          git diff --exit-code -- "${GENERATED_PATHS[@]}"
