name: Validate Skills

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify project identity contract
        run: npm run identity:check

      - name: Validate contribution scope
        if: github.event_name == 'pull_request'
        run: |
          python3 tools/scripts/validate_contribution_scope.py \
            --repository "${GITHUB_REPOSITORY}" \
            --event-path "${GITHUB_EVENT_PATH}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}"

      - name: Build generated artifacts
        run: npm run build

      - name: Install python test dependencies
        run: pip install pexpect

      - name: Run tests
        run: npm test

      - name: Resolve generated artifact diff scope
        id: generated_scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] && [[ "${{ github.ref_name }}" == "main" ]]; then
            {
              echo 'paths<<__PATHS__'
              printf '%s\n' \
                README.md \
                CONTRIBUTING.md \
                REPOSITORY-SOURCES.md \
                data/project_status.json \
                metadata.json \
                skills \
                dist/catalog.json \
                dist/bundles.json \
                dist/catalog.db \
                docs \
                ':(exclude)skills/*/metadata.json' \
                ':(exclude)skills_omni/*/metadata.json'
              echo '__PATHS__'
            } >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]] \
            && [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]] \
            && [[ "${{ github.event.pull_request.head.ref }}" == skills-omni/pr-* ]] \
            && { [[ "${{ github.event.pull_request.title }}" == enhance:\ promote\ curated\ skills_omni\ candidates\ for\ #* ]] \
              || [[ "${{ github.event.pull_request.title }}" == feat\(skills_omni\):\ curate\ #* ]]; } \
            && { [[ "${{ github.event.pull_request.body }}" == *"This PR was generated automatically from source PR #"* ]] \
              || [[ "${{ github.event.pull_request.body }}" == *"## Private Curated Companion PR"* ]]; }; then
            {
              echo 'paths<<__PATHS__'
              printf '%s\n' \
                metadata.json \
                dist/catalog.json \
                dist/bundles.json \
                dist/catalog.db \
                skills_omni \
                ':(exclude)skills_omni/*/metadata.json'
              echo '__PATHS__'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'paths<<__PATHS__'
              printf '%s\n' \
                README.md \
                CONTRIBUTING.md \
                REPOSITORY-SOURCES.md \
                data/project_status.json \
                metadata.json \
                skills \
                dist/catalog.json \
                dist/bundles.json \
                dist/catalog.db \
                docs \
                ':(exclude)skills/*/metadata.json' \
                ':(exclude)skills_omni/*/metadata.json'
              echo '__PATHS__'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Check generated artifacts are committed
        shell: bash
        run: |
          mapfile -t GENERATED_PATHS < <(printf '%s\n' "${{ steps.generated_scope.outputs.paths }}")
          git diff --exit-code -- "${GENERATED_PATHS[@]}"
