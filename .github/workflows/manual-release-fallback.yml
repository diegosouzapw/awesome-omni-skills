name: Manual Release Fallback

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit version to publish (defaults to next computed version)."
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      OMNI_SKILLS_EMBED_OPTIONAL_SECURITY_RESULTS: "1"
      OMNI_SKILLS_EMBED_SIGNATURES: "1"
      VT_API_KEY: ${{ secrets.VT_API_KEY || secrets.VIRUSTOTAL }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Determine release version
        id: release_version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            NEXT_VERSION="$INPUT_VERSION"
          else
            NEXT_VERSION="$(python3 tools/scripts/next_release_version.py)"
          fi
          echo "value=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify required release secrets
        env:
          SIGN_PRIVATE_KEY_B64: ${{ secrets.OMNI_SKILLS_SIGN_PRIVATE_KEY_B64 }}
          SIGN_PRIVATE_KEY: ${{ secrets.OMNI_SKILLS_SIGN_PRIVATE_KEY }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${VT_API_KEY:-}" ]; then
            echo "VT_API_KEY or VIRUSTOTAL is required for release publication."
            exit 1
          fi
          if [ -z "${SIGN_PRIVATE_KEY_B64:-}" ] && [ -z "${SIGN_PRIVATE_KEY:-}" ]; then
            echo "OMNI_SKILLS_SIGN_PRIVATE_KEY_B64 or OMNI_SKILLS_SIGN_PRIVATE_KEY is required for release signing."
            exit 1
          fi
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is required for npm publication."
            exit 1
          fi

      - name: Prepare signing material
        env:
          SIGN_PRIVATE_KEY_B64: ${{ secrets.OMNI_SKILLS_SIGN_PRIVATE_KEY_B64 }}
          SIGN_PRIVATE_KEY: ${{ secrets.OMNI_SKILLS_SIGN_PRIVATE_KEY }}
          SIGN_PUBLIC_KEY_B64: ${{ secrets.OMNI_SKILLS_SIGN_PUBLIC_KEY_B64 }}
          SIGN_PUBLIC_KEY: ${{ secrets.OMNI_SKILLS_SIGN_PUBLIC_KEY }}
        run: |
          SIGNING_DIR="$RUNNER_TEMP/awesome-omni-skills-signing"
          mkdir -p "$SIGNING_DIR"

          if [ -n "${SIGN_PRIVATE_KEY_B64:-}" ]; then
            printf '%s' "$SIGN_PRIVATE_KEY_B64" | base64 --decode > "$SIGNING_DIR/private.pem"
          else
            printf '%s\n' "$SIGN_PRIVATE_KEY" > "$SIGNING_DIR/private.pem"
          fi

          if [ -n "${SIGN_PUBLIC_KEY_B64:-}" ]; then
            printf '%s' "$SIGN_PUBLIC_KEY_B64" | base64 --decode > "$SIGNING_DIR/public.pem"
          elif [ -n "${SIGN_PUBLIC_KEY:-}" ]; then
            printf '%s\n' "$SIGN_PUBLIC_KEY" > "$SIGNING_DIR/public.pem"
          fi

          chmod 600 "$SIGNING_DIR/private.pem"
          echo "OMNI_SKILLS_SIGN_PRIVATE_KEY_PATH=$SIGNING_DIR/private.pem" >> "$GITHUB_ENV"
          if [ -f "$SIGNING_DIR/public.pem" ]; then
            chmod 644 "$SIGNING_DIR/public.pem"
            echo "OMNI_SKILLS_SIGN_PUBLIC_KEY_PATH=$SIGNING_DIR/public.pem" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Bump package version and sync repository references
        run: |
          python3 tools/scripts/sync_repo_version.py \
            --version "${{ steps.release_version.outputs.value }}" \
            --update-package-jsons

      - name: Lightweight package sanity check
        run: |
          npm run identity:check
          npm pack --dry-run >/dev/null

      - name: Package release tarball
        id: pack
        run: |
          TARBALL="$(npm pack | tail -n 1)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Generate custom release notes
        run: |
          python3 tools/scripts/generate_release_notes.py \
            --output dist/release-notes.md \
            --version "${{ steps.release_version.outputs.value }}" \
            --tag "${{ steps.release_version.outputs.tag }}"

      - name: Commit version bump and generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages metadata.json skills dist docs README.md CONTRIBUTING.md
          git add data/project_status.json
          git add -f skills_index.json
          git reset --quiet -- dist/release-notes.md || true
          git commit -m "chore(release): bump version to ${{ steps.release_version.outputs.tag }}"

      - name: Create release tag
        run: git tag -a "${{ steps.release_version.outputs.tag }}" -m "Release ${{ steps.release_version.outputs.tag }}"

      - name: Push version commit and tag
        run: git push origin HEAD:main --follow-tags

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          files: |
            ${{ steps.pack.outputs.tarball }}
            metadata.json
            skills_index.json
            dist/release-notes.md
            docs/CATALOG.md
            dist/catalog.json
            dist/bundles.json
            dist/archives/*.checksums.txt
            dist/archives/*.sig
            dist/signing/**
